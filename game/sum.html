<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>妙手抄纸 - 畲纸工坊（优化版）</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f0;
            margin: 0;
            padding: 0;
        }
        .game-container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .section {
            margin-bottom: 30px;
        }
        h2 {
            text-align: center;
            margin-bottom: 10px;
        }
        /* 通用信息面板 */
        .info-panel {
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            margin-bottom: 15px;
        }
        /* 竹林选材模块样式 */
        .bamboo-grove {
            position: relative;
            height: 400px;
            background: linear-gradient(180deg, #87CEEB 30%, #5a7d3b 100%);
            overflow: hidden;
            border-radius: 10px;
        }
        .bamboo {
            position: absolute;
            bottom: 0;
            width: 60px;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .bamboo.correct {
            animation: glow 1s infinite alternate;
        }
        @keyframes glow {
            from {
                filter: drop-shadow(0 0 5px #3b5323);
            }
            to {
                filter: drop-shadow(0 0 15px #8BC34A);
            }
        }
        /* 打浆节奏模块样式 */
        .dual-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            background: #f5f5f5;
            border-radius: 10px;
            padding: 20px;
        }
        #rhythmGame {
            position: relative;
            height: 300px;
            background: #2c3e50;
            border-radius: 8px;
            overflow: hidden;
        }
        .beat-node {
            position: absolute;
            width: 40px;
            height: 40px;
            background: #e74c3c;
            border-radius: 50%;
            transform: translateX(-50%);
            animation: fall 2.5s linear;
        }
        @keyframes fall {
            from {
                top: -40px;
            }
            to {
                top: 100%;
            }
        }
        #tempControl {
            height: 300px;
            background: #34495e;
            border-radius: 8px;
            padding: 20px;
        }
        .temp-indicator {
            height: 100%;
            background: linear-gradient(to top, #3498db, #e74c3c);
            width: 30px;
            position: relative;
            border-radius: 15px;
        }
        .temp-marker {
            position: absolute;
            width: 100%;
            height: 3px;
            background: #fff;
            left: 0;
        }
        .difficulty-meter {
            height: 10px;
            background: #ecf0f1;
            border-radius: 5px;
            margin-top: 10px;
        }
        /* 抄纸工序模块样式 */
        #paperCanvas {
            border: 2px solid #654321;
            background: #f0f4c3;
            touch-action: none;
            margin: 0 auto;
            display: block;
        }
        .control-guide {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
        }
        .gesture-icon {
            text-align: center;
            padding: 10px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        /* 定型升华模块样式 */
        .press-section {
            padding: 20px;
            background: #f0f0f0;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }
        .power-bar {
            width: 100%;
            height: 30px;
            background: #ddd;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            margin: 15px 0;
        }
        .power-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(to right, #4CAF50, #FFC107, #F44336);
            transition: width 0.1s;
        }
        .optimal-zone {
            position: absolute;
            height: 100%;
            background: rgba(255, 255, 255, 0.3);
            z-index: 1;
        }
        .dry-wall {
            height: 400px;
            border: 2px dashed #795548;
            position: relative;
            background: #FFF3E0;
        }
        .wet-paper {
            width: 120px;
            height: 80px;
            background: rgba(0, 100, 0, 0.3);
            position: absolute;
            cursor: move;
            transition: transform 0.3s, background 0.5s;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }
        /* 提示文本样式 */
        .tip-text {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
<div class="game-container">
    <!-- 竹林选材模块 -->
    <div class="section" id="bambooSection">
        <h2>步骤一：竹林选材</h2>
        <div class="info-panel">
            <p id="taskDesc">要求：年龄 ≥3年 | 壁厚 ≥0.8cm | 颜色：深青</p>
            <p>剩余尝试次数：<span id="attempts">5</span></p>
        </div>
        <div class="bamboo-grove" id="grove"></div>
    </div>
    <!-- 打浆节奏模块 -->
    <div class="section" id="pulpSection" style="display: none;">
        <h2>步骤二：打浆节奏</h2>
        <div class="info-panel">
            <p>当前难度：<span id="difficultyLevel">1</span></p>
            <p>纸浆质量：<span id="pulpQuality">0</span>/100</p>
            <div class="difficulty-meter">
                <div id="difficultyBar" style="width: 0%; height: 100%; background: #2ecc71;"></div>
            </div>
        </div>
        <div class="dual-panel">
            <div id="rhythmGame"></div>
            <div id="tempControl">
                <div class="temp-indicator">
                    <div class="temp-marker" style="bottom: 80%"></div>
                </div>
            </div>
        </div>
    </div>
    <!-- 抄纸工序模块 -->
    <div class="section" id="paperSection" style="display: none;">
        <h2>步骤三：抄纸工序 - 荡浆成形</h2>
        <div class="info-panel">
            <p>均匀度：<span id="uniformity">0%</span></p>
            <p>当前层数：<span id="layerCount">0</span>/1（1层即可完成）</p>
            <p class="tip-text">提示：拖动纸帘覆盖整个画布，均匀度达标即完成</p>
        </div>
        <canvas id="paperCanvas" width="800" height="400"></canvas>
        <div class="control-guide">
            <div class="gesture-icon">
                <div style="font-size: 40px">→</div>
                <p>水平荡浆</p>
            </div>
            <div class="gesture-icon">
                <div style="font-size: 40px">↑</div>
                <p>垂直提帘</p>
            </div>
            <div class="gesture-icon">
                <div style="font-size: 40px">⭮</div>
                <p>旋转控水</p>
            </div>
        </div>
    </div>
    <!-- 定型升华模块（优化后） -->
    <div class="section" id="drySection" style="display: none;">
        <h2>步骤四：定型升华</h2>
        <div class="press-section">
            <h3>榨水工序 - 力度控制</h3>
            <div class="power-bar">
                <div class="optimal-zone" style="left: 40%; width: 20%;"></div>
                <div class="power-fill"></div>
            </div>
            <p>最佳区间：40%-60%（需手动控制力度）</p>
            <button id="pressBtn" ontouchstart="startPress()" ontouchend="endPress()"
                    onmousedown="startPress()" onmouseup="endPress()">按住榨水</button>
            <p class="tip-text">提示：力度达到最佳区间时手动松开</p>
        </div>
        <div class="dry-wall" id="dryWall">
            <div id="wetPaper" class="wet-paper"></div>
        </div>
        <p id="dryStatus">干燥进度：0%</p>
        <p class="tip-text">提示：拖动湿纸到任意位置即可开始快速干燥</p>
    </div>
</div>
<script>
    // -------------------- 竹林模块 --------------------
    class BambooSelector {
        constructor(callback) {
            this.grove = document.getElementById('grove');
            this.attempts = 5;
            this.callback = callback;
            this.initGrove();
        }

        generateBambooStats() {
            return {
                age: Math.floor(Math.random() * 5) + 1,
                thickness: (Math.random() * 1.2 + 0.3).toFixed(1),
                color: ['#5a7d3b', '#3b5323', '#6b8e23'][Math.floor(Math.random() * 3)]
            };
        }

        createBambooElement(stats, index) {
            const bamboo = document.createElement('div');
            bamboo.className = 'bamboo';
            bamboo.style.left = `${10 + index * 12}%`;
            bamboo.style.height = `${150 + stats.age * 30}px`;
            bamboo.innerHTML = `<div style="width:100%; height:100%; background: repeating-linear-gradient(to bottom, ${stats.color}, ${stats.color} 10px, #f0f0f0 10px, #f0f0f0 20px)"></div>`;
            bamboo.dataset.age = stats.age;
            bamboo.dataset.thickness = stats.thickness;
            bamboo.dataset.color = stats.color;

            bamboo.addEventListener('click', () => this.checkBamboo(bamboo));
            return bamboo;
        }

        initGrove() {
            this.grove.innerHTML = '';
            const bamboos = Array.from({ length: 6 }, (_, i) => {
                const stats = this.generateBambooStats();
                if (i === 3) {
                    stats.age = Math.max(3, stats.age);
                    stats.thickness = Math.max(0.8, stats.thickness);
                    stats.color = '#3b5323';
                }
                return stats;
            });

            bamboos.forEach((stats, i) => {
                this.grove.appendChild(this.createBambooElement(stats, i));
            });
        }

        checkBamboo(bamboo) {
            if (this.attempts <= 0) return;

            const age = parseInt(bamboo.dataset.age);
            const thickness = parseFloat(bamboo.dataset.thickness);
            const color = bamboo.dataset.color;
            const isCorrect = age >= 3 && thickness >= 0.8 && color === '#3b5323';

            if (isCorrect) {
                bamboo.classList.add('correct');
                setTimeout(() => {
                    alert(`选中成功！\n竹龄：${age}年\n壁厚：${thickness}cm`);
                    document.getElementById('bambooSection').style.display = 'none';
                    document.getElementById('pulpSection').style.display = 'block';
                    this.callback();
                }, 800);
            } else {
                this.attempts--;
                document.getElementById('attempts').textContent = this.attempts;
                bamboo.style.transform = 'rotate(5deg)';
                setTimeout(() => bamboo.style.transform = '', 400);
            }
        }
    }

    // -------------------- 打浆模块 --------------------
    class PulpGame {
        constructor(callback) {
            this.gameArea = document.getElementById('rhythmGame');
            this.tempControl = document.getElementById('tempControl');
            this.difficulty = 1;
            this.pulpQuality = 0;
            this.tempValue = 85;
            this.gameActive = true;
            this.callback = callback;
            this.initGame();
        }

        initGame() {
            this.gameArea.onclick = (e) => this.handleRhythmClick(e);
            this.tempControl.onmousemove = (e) => this.handleTempControl(e);
            this.startRhythmGenerator();
            this.startTempFluctuation();
            this.updateTempDisplay();
        }

        startRhythmGenerator() {
            const interval = () => 2500 - (this.difficulty - 1) * 200;
            this.rhythmTimer = setInterval(() => {
                if (!this.gameActive) return;
                this.createBeatNode();
                if (this.pulpQuality % 30 === 0 && this.pulpQuality > 0) {
                    this.difficulty = Math.min(3, 1 + Math.floor(this.pulpQuality / 30));
                    document.getElementById('difficultyLevel').textContent = this.difficulty;
                    document.getElementById('difficultyBar').style.width = `${this.difficulty * 33}%`;
                }
            }, interval());
        }

        createBeatNode() {
            const node = document.createElement('div');
            node.className = 'beat-node';
            node.style.left = `${Math.random() * 60 + 20}%`;
            node.dataset.perfectTime = Date.now() + 2200;
            this.gameArea.appendChild(node);

            setTimeout(() => {
                if (node.parentElement) {
                    this.handleMissedBeat();
                    node.remove();
                }
            }, 2500);
        }

        handleRhythmClick(e) {
            const beatNodes = document.getElementsByClassName('beat-node');
            Array.from(beatNodes).forEach(node => {
                const rect = node.getBoundingClientRect();
                if (e.clientY > rect.top - 20 && e.clientY < rect.bottom + 20 &&
                    e.clientX > rect.left - 20 && e.clientX < rect.right + 20) {
                    const timing = Math.abs(Date.now() - node.dataset.perfectTime);
                    this.calculateScore(timing);
                    node.remove();
                }
            });
        }

        startTempFluctuation() {
            setInterval(() => {
                if (!this.gameActive) return;
                const fluctuation = (Math.random() - 0.5) * (2 + this.difficulty);
                this.tempValue = Math.min(90, Math.max(80, this.tempValue + fluctuation));
                this.updateTempDisplay();
                this.checkTempRange();
            }, 1500);
        }

        handleTempControl(e) {
            const rect = this.tempControl.getBoundingClientRect();
            const tempPosition = 1 - ((e.clientY - rect.top) / rect.height);
            this.tempValue = Math.round(75 + tempPosition * 20);
            this.updateTempDisplay();
        }

        updateTempDisplay() {
            const marker = this.tempControl.querySelector('.temp-marker');
            marker.style.bottom = `${100 - (this.tempValue - 75) * 5}%`;
        }

        calculateScore(timingDeviation) {
            let score = 0;
            if (timingDeviation < 200) score += 30;
            else if (timingDeviation < 400) score += 20;
            else score += 15;

            if (this.tempValue >= 80 && this.tempValue <= 90) score += 25;
            else if (this.tempValue >= 75 && this.tempValue <= 95) score += 15;

            this.pulpQuality = Math.min(100, this.pulpQuality + score);
            document.getElementById('pulpQuality').textContent = this.pulpQuality;

            if (this.pulpQuality >= 100) {
                alert("打浆完成！纸浆质量优良！");
                this.gameActive = false;
                document.getElementById('pulpSection').style.display = 'none';
                document.getElementById('paperSection').style.display = 'block';
                this.callback();
            }
        }

        handleMissedBeat() {
            this.pulpQuality = Math.max(0, this.pulpQuality - 5);
            document.getElementById('pulpQuality').textContent = this.pulpQuality;
        }

        checkTempRange() {
            if (this.tempValue < 80 || this.tempValue > 90) {
                this.pulpQuality = Math.max(0, this.pulpQuality - 2);
                document.getElementById('pulpQuality').textContent = this.pulpQuality;
            }
        }
    }

    // -------------------- 抄纸工序模块 --------------------
    class PaperSimulator {
        constructor(callback) {
            this.canvas = document.getElementById('paperCanvas');
            this.ctx = this.canvas.getContext('2d');
            this.pulpData = [];
            this.callback = callback;
            this.initSimulation();
            this.setupEventListeners();
        }

        initSimulation() {
            this.pulpData = Array(20).fill(0).map(() => Array(10).fill(0));
            this.layerCount = 0;
            this.mouldPosition = { x: 400, y: 200, angle: 0 };
            this.updateDisplay();
        }

        setupEventListeners() {
            let isDragging = false;
            let lastPos = { x: 0, y: 0 };

            this.canvas.addEventListener('mousedown', (e) => {
                isDragging = true;
                lastPos = this.getCanvasPosition(e);
            });

            this.canvas.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                this.handleMove(this.getCanvasPosition(e), lastPos);
                lastPos = this.getCanvasPosition(e);
            });

            this.canvas.addEventListener('mouseup', () => {
                isDragging = false;
                this.checkLayerComplete();
            });

            this.canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                isDragging = true;
                lastPos = this.getCanvasPosition(e.touches[0]);
            });

            this.canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (!isDragging) return;
                this.handleMove(this.getCanvasPosition(e.touches[0]), lastPos);
                lastPos = this.getCanvasPosition(e.touches[0]);
            });

            this.canvas.addEventListener('touchend', () => {
                isDragging = false;
                this.checkLayerComplete();
            });
        }

        getCanvasPosition(event) {
            const rect = this.canvas.getBoundingClientRect();
            return {
                x: (event.clientX - rect.left) * (this.canvas.width / rect.width),
                y: (event.clientY - rect.top) * (this.canvas.height / rect.height)
            };
        }

        handleMove(currentPos, lastPos) {
            const deltaX = currentPos.x - lastPos.x;
            const deltaY = currentPos.y - lastPos.y;

            this.mouldPosition.x = Math.max(0, Math.min(this.canvas.width, this.mouldPosition.x + deltaX));
            this.mouldPosition.y = Math.max(0, Math.min(this.canvas.height, this.mouldPosition.y + deltaY));
            this.mouldPosition.angle = Math.atan2(deltaY, deltaX);

            this.simulateFluidFlow(deltaX, deltaY);
            this.updateDisplay();
        }

        simulateFluidFlow(dx, dy) {
            const intensity = Math.sqrt(dx * dx + dy * dy) * 1.2;
            const centerX = this.mouldPosition.x;
            const centerY = this.mouldPosition.y;

            for (let i = 0; i < 20; i++) {
                for (let j = 0; j < 10; j++) {
                    const x = i * 40 + 20;
                    const y = j * 40 + 20;
                    const distance = Math.sqrt((x - centerX) **2 + (y - centerY)** 2);

                    if (distance < 150) {
                        const force = (1 - distance / 150) * intensity;
                        this.pulpData[i][j] = Math.min(100, this.pulpData[i][j] + force);
                    }
                }
            }
        }

        calculateUniformity() {
            const values = this.pulpData.flat();
            const mean = values.reduce((a, b) => a + b, 0) / values.length;
            const deviation = values.reduce((a, v) => a + (v - mean) **2, 0);
            return Math.max(0, 100 - Math.sqrt(deviation / values.length));
        }

        checkLayerComplete() {
            const uniformity = this.calculateUniformity();
            document.getElementById('uniformity').textContent = uniformity.toFixed(1) + '%';

            if (uniformity >= 50) {
                this.layerCount++;
                document.getElementById('layerCount').textContent = this.layerCount;

                if (this.layerCount >= 1) {
                    alert('抄纸完成！进入下一工序');
                    document.getElementById('paperSection').style.display = 'none';
                    document.getElementById('drySection').style.display = 'block';
                    this.callback();
                }
            }
        }

        updateDisplay() {
            this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

            for (let i = 0; i < 20; i++) {
                for (let j = 0; j < 10; j++) {
                    const alpha = this.pulpData[i][j] / 100;
                    this.ctx.fillStyle = `rgba(50,100,50,${alpha})`;
                    this.ctx.fillRect(i * 40, j * 40, 40, 40);
                }
            }

            this.ctx.save();
            this.ctx.translate(this.mouldPosition.x, this.mouldPosition.y);
            this.ctx.rotate(this.mouldPosition.angle);
            this.ctx.strokeStyle = '#8B4513';
            this.ctx.lineWidth = 3;
            this.ctx.strokeRect(-60, -40, 120, 80);
            this.ctx.restore();
        }
    }

    // -------------------- 定型升华模块（优化后） --------------------
    class DryStage {
        constructor() {
            this.pressPower = 0;
            this.isPressing = false;
            this.pressInterval = null;
            this.dryProgress = 0;
            this.wetPaper = document.getElementById('wetPaper');
            this.isDrying = false;
            this.initEvents();
        }

        initEvents() {
            let isDragging = false;
            let startPos = { x: 0, y: 0 };

            this.wetPaper.addEventListener('mousedown', (e) => {
                isDragging = true;
                startPos = {
                    x: e.clientX - this.wetPaper.offsetLeft,
                    y: e.clientY - this.wetPaper.offsetTop
                };
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging || this.isDrying) return;
                this.handleDrag(e, startPos);
            });

            document.addEventListener('mouseup', () => {
                if (!isDragging || this.isDrying) return;
                isDragging = false;
                this.startDrying();
            });

            this.wetPaper.addEventListener('touchstart', (e) => {
                e.preventDefault();
                isDragging = true;
                const touch = e.touches[0];
                startPos = {
                    x: touch.clientX - this.wetPaper.offsetLeft,
                    y: touch.clientY - this.wetPaper.offsetTop
                };
            });

            document.addEventListener('touchmove', (e) => {
                if (!isDragging || this.isDrying) return;
                e.preventDefault();
                const touch = e.touches[0];
                this.handleDrag(touch, startPos);
            });

            document.addEventListener('touchend', () => {
                if (!isDragging || this.isDrying) return;
                isDragging = false;
                this.startDrying();
            });
        }

        startPress() {
            if (this.isPressing) return;
            this.isPressing = true;
            this.pressInterval = setInterval(() => {
                this.pressPower = Math.min(100, this.pressPower + 1.5);
                document.querySelector('.power-fill').style.width = this.pressPower + '%';
                // 移除自动锁定逻辑，完全由用户控制
            }, 50);
        }

        endPress() {
            this.isPressing = false;
            clearInterval(this.pressInterval);

            let result = '';
            if (this.pressPower < 40) {
                result = '榨水不足！纸张含水率过高';
            } else if (this.pressPower > 60) {
                result = '压力过大！纤维结构受损';
            } else {
                result = '榨水成功！含水率达标';
            }
            alert(result);

            this.pressPower = 0;
            document.querySelector('.power-fill').style.width = '0%';
            this.wetPaper.style.display = 'block';
        }

        handleDrag(e, startPos) {
            const dryWall = document.getElementById('dryWall');
            const wallRect = dryWall.getBoundingClientRect();

            let left = e.clientX - startPos.x - wallRect.left;
            let top = e.clientY - startPos.y - wallRect.top;

            left = Math.max(0, Math.min(wallRect.width - this.wetPaper.offsetWidth, left));
            top = Math.max(0, Math.min(wallRect.height - this.wetPaper.offsetHeight, top));

            this.wetPaper.style.left = `${left}px`;
            this.wetPaper.style.top = `${top}px`;
        }

        tearPaper() {
            alert('操作过快！纸张已撕裂，已自动修复');
            this.wetPaper.style.background = 'rgba(0,100,0,0.3)';
        }

        startDrying() {
            if (this.isDrying) return;
            this.isDrying = true;
            // 大幅提高干燥速度，晴天概率提高
            const weather = Math.random() > 0.2 ? 'sunny' : 'cloudy';
            const drySpeed = weather === 'sunny' ? 15 : 8; // 显著加快干燥速度

            const dryInterval = setInterval(() => {
                this.dryProgress = Math.min(100, this.dryProgress + drySpeed);
                document.getElementById('dryStatus').textContent =
                    `干燥进度：${this.dryProgress}% (${weather === 'sunny' ? '晴天' : '阴天'})`;

                this.wetPaper.style.background = `rgba(0,100,0,${0.3 - this.dryProgress / 300})`;

                if (this.dryProgress >= 100) {
                    clearInterval(dryInterval);
                    alert('干燥完成！纸张成品质量：' + this.calculateQuality() + '\n恭喜完成所有工序！');
                }
            }, 500); // 缩短时间间隔，进一步加快视觉反馈
        }

        calculateQuality() {
            const pressScore = this.pressPower >= 40 && this.pressPower <= 60 ? 100 : 80;
            const dryScore = 100;
            return ((pressScore * 0.6) + (dryScore * 0.4)).toFixed(1) + '分';
        }
    }

    // 全局事件绑定
    function startPress() {
        dryGame.startPress();
    }

    function endPress() {
        dryGame.endPress();
    }

    // 启动游戏
    const dryGame = new DryStage();
    new BambooSelector(() => new PulpGame(() => new PaperSimulator(() => {})));
</script>
</body>
</html>
