<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>畲乡玉扣纸游戏</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.14.0/dist/phaser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f5f1e6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        #game-container {
            box-shadow: 0 0 20px rgb(255, 255, 255);
            border-radius: 10px;
            overflow: hidden;
        }
    </style>
</head>
<body>
<div id="game-container">
    <div id="game"></div>
</div>
<script>
    // 全局样式配置
    const GlobalStyles = {
        colors: {
            primary: '#8B4513',      // 棕色 - 代表木材/纸张
            secondary: '#2F4F4F',    // 深橄榄绿 - 代表自然
            accent: '#D2B48C',       // 棕褐色 - 代表纸张色调
            light: '#F5F5DC',        // 米色 - 背景色
            text: '#3E2723',         // 深棕色 - 文本
            highlight: '#CD853F'     // 秘鲁色 - 强调
        },
        fonts: {
            title: '"Ma Shan Zheng", cursive, sans-serif',
            body: '"Noto Serif SC", serif'
        },
        ui: {
            padding: 20,
            borderRadius: 8
        }
    };

    // 加载Google字体
    const loadFonts = () => {
        const link = document.createElement('link');
        link.href = 'https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600&display=swap';
        link.rel = 'stylesheet';
        document.head.appendChild(link);
    };
    loadFonts();

    class BambooSelectionScene extends Phaser.Scene {
        constructor() {
            super('BambooSelectionScene');
        }

        preload() {
            // 加载竹子图片和背景
            this.load.image('bamboo1', 'assets/bamboo1.png');
            this.load.image('bamboo2', 'assets/bamboo2.png');
            this.load.image('bamboo3', 'assets/bamboo3.png');
            this.load.image('bg', 'assets/paper_texture.jpg'); // 纸张纹理背景
        }

        create() {
            // 创建背景
            const bg = this.add.image(400, 300, 'bg').setScale(1.2);
            bg.setTint(0xe8e0d0); // 调整背景色调

            // 创建标题
            this.add.text(400, 80, '选择竹子类型', {
                fontSize: '42px',
                fill: GlobalStyles.colors.text,
                fontFamily: GlobalStyles.fonts.title,
                stroke: '#fff',
                strokeThickness: 2
            }).setOrigin(0.5);

            // 创建竹子选择区容器
            const bambooContainer = this.add.container(400, 300);

            // 竹子图片
            const bamboo1 = this.add.image(-200, 0, 'bamboo1').setInteractive().setScale(0.9);
            const bamboo2 = this.add.image(0, 0, 'bamboo2').setInteractive().setScale(0.9);
            const bamboo3 = this.add.image(200, 0, 'bamboo3').setInteractive().setScale(0.9);

            // 添加竹子到容器
            bambooContainer.add([bamboo1, bamboo2, bamboo3]);

            // 添加竹子名称标签
            this.add.text(200, 380, '毛竹', {
                fontSize: '22px',
                fill: GlobalStyles.colors.text,
                fontFamily: GlobalStyles.fonts.body
            }).setOrigin(0.5);

            this.add.text(400, 380, '箭竹', {
                fontSize: '22px',
                fill: GlobalStyles.colors.text,
                fontFamily: GlobalStyles.fonts.body
            }).setOrigin(0.5);

            this.add.text(600, 380, '苦竹', {
                fontSize: '22px',
                fill: GlobalStyles.colors.text,
                fontFamily: GlobalStyles.fonts.body
            }).setOrigin(0.5);

            // 交互效果 - 悬停放大
            [bamboo1, bamboo2, bamboo3].forEach(bamboo => {
                bamboo.on('pointerover', () => {
                    this.tweens.add({
                        targets: bamboo,
                        scale: 1.05,
                        duration: 200,
                        ease: 'Power2'
                    });
                });

                bamboo.on('pointerout', () => {
                    this.tweens.add({
                        targets: bamboo,
                        scale: 0.9,
                        duration: 200,
                        ease: 'Power2'
                    });
                });
            });

            // 点击事件
            bamboo1.on('pointerdown', () => {
                this.scene.start('SoakingScene', { bamboo: '毛竹', bambooImg: 'bamboo1' });
            });
            bamboo2.on('pointerdown', () => {
                this.scene.start('SoakingScene', { bamboo: '箭竹', bambooImg: 'bamboo2' });
            });
            bamboo3.on('pointerdown', () => {
                this.scene.start('SoakingScene', { bamboo: '苦竹', bambooImg: 'bamboo3' });
            });

            // 信息文本
            const infoText = this.add.text(400, 500, '畲乡玉扣纸使用当地优质毛竹，选材是保证纸张质量的第一步', {
                fontSize: '18px',
                fill: GlobalStyles.colors.text,
                fontFamily: GlobalStyles.fonts.body,
                align: 'center',
                wordWrap: { width: 700 }
            }).setOrigin(0.5);

            // 添加装饰性边框
            const border = this.add.graphics();
            border.lineStyle(3, GlobalStyles.colors.primary, 0.3);
            border.strokeRoundedRect(50, 50, 700, 500, 10);
        }
    }

    class SoakingScene extends Phaser.Scene {
        constructor() {
            super('SoakingScene');
        }

        init(data) {
            this.bambooType = data.bamboo;
            this.bambooImg = data.bambooImg;
        }

        preload() {
            this.load.image('water', 'assets/water.png');
            this.load.image('container', 'assets/wooden_container.png'); // 木桶图片
        }

        create() {
            // 背景
            this.add.rectangle(400, 300, 800, 600, GlobalStyles.colors.light);

            // 标题
            this.add.text(400, 80, `浸泡${this.bambooType}`, {
                fontSize: '42px',
                fill: GlobalStyles.colors.text,
                fontFamily: GlobalStyles.fonts.title,
                stroke: '#fff',
                strokeThickness: 2
            }).setOrigin(0.5);

            // 木桶容器
            this.add.image(400, 350, 'container').setScale(1.1);

            // 水和竹子
            const water = this.add.image(400, 350, 'water').setScale(0.8);
            const bamboo = this.add.image(400, 320, this.bambooImg).setScale(0.7);

            // 让竹子在水中轻微浮动
            this.tweens.add({
                targets: bamboo,
                y: 330,
                duration: 2000,
                yoyo: true,
                repeat: -1,
                ease: 'Sine.inOut'
            });

            // 进度条背景
            this.add.rectangle(400, 200, 500, 40, 0xffffff, 0.7)
                .setOrigin(0.5)
                .setStrokeStyle(2, GlobalStyles.colors.primary);

            // 进度条
            this.soakProgress = this.add.graphics();
            this.soakTime = 0;
            this.maxSoakTime = 10000;

            // 进度文本
            this.progressText = this.add.text(400, 250, '浸泡中: 0%', {
                fontSize: '20px',
                fill: GlobalStyles.colors.text,
                fontFamily: GlobalStyles.fonts.body
            }).setOrigin(0.5);

            // 定时更新进度
            this.time.addEvent({
                delay: 100,
                callback: this.updateSoak,
                callbackScope: this,
                loop: true
            });

            // 信息文本
            this.add.text(400, 500, '浸泡可以软化竹子纤维，为后续制浆做好准备', {
                fontSize: '18px',
                fill: GlobalStyles.colors.text,
                fontFamily: GlobalStyles.fonts.body,
                align: 'center',
                wordWrap: { width: 700 }
            }).setOrigin(0.5);
        }

        updateSoak() {
            this.soakTime += 100;
            const progress = this.soakTime / this.maxSoakTime;

            // 更新进度条
            this.soakProgress.clear();
            this.soakProgress.fillStyle(GlobalStyles.colors.highlight, 1);
            this.soakProgress.fillRoundedRect(150, 180, 500 * progress, 40, 5);

            // 更新进度文本
            this.progressText.setText(`浸泡中: ${Math.round(progress * 100)}%`);

            if (this.soakTime >= this.maxSoakTime) {
                this.scene.start('TreadingScene', {
                    bamboo: this.bambooType,
                    soakQuality: 'good'
                });
            }
        }
    }

    class TreadingScene extends Phaser.Scene {
        constructor() {
            super('TreadingScene');
        }

        init(data) {
            this.bambooType = data.bamboo;
            this.soakQuality = data.soakQuality;
        }

        preload() {
            this.load.image('trough', 'assets/wooden_trough.png'); // 木槽图片
            this.load.image('foot', 'assets/foot.png'); // 脚印图片
        }

        create() {
            // 背景
            this.add.rectangle(400, 300, 800, 600, GlobalStyles.colors.light);

            // 标题
            this.add.text(400, 80, '踩踏纤维', {
                fontSize: '42px',
                fill: GlobalStyles.colors.text,
                fontFamily: GlobalStyles.fonts.title,
                stroke: '#fff',
                strokeThickness: 2
            }).setOrigin(0.5);

            // 木槽
            this.add.image(400, 380, 'trough').setScale(1.2);

            // 踩踏进度
            this.treadProgress = 0;
            this.maxTreadProgress = 10;
            this.progressText = this.add.text(400, 200, `踩踏进度: 0/${this.maxTreadProgress}`, {
                fontSize: '24px',
                fill: GlobalStyles.colors.text,
                fontFamily: GlobalStyles.fonts.body
            }).setOrigin(0.5);

            // 脚印容器
            this.footprints = this.add.container(400, 380);

            // 提示文本
            this.add.text(400, 250, '点击屏幕模拟踩踏动作', {
                fontSize: '22px',
                fill: GlobalStyles.colors.text,
                fontFamily: GlobalStyles.fonts.body,
                align: 'center'
            }).setOrigin(0.5);

            // 点击事件
            this.input.on('pointerdown', () => this.tread());

            // 信息文本
            this.add.text(400, 500, '踩踏将纤维分解成纸浆，这是制作玉扣纸的关键步骤', {
                fontSize: '18px',
                fill: GlobalStyles.colors.text,
                fontFamily: GlobalStyles.fonts.body,
                align: 'center',
                wordWrap: { width: 700 }
            }).setOrigin(0.5);
        }

        tread() {
            if (this.treadProgress < this.maxTreadProgress) {
                this.treadProgress++;
                this.progressText.setText(`踩踏进度: ${this.treadProgress}/${this.maxTreadProgress}`);

                // 添加脚印效果
                const foot = this.add.image(
                    Phaser.Math.Between(-100, 100),
                    Phaser.Math.Between(-30, 30),
                    'foot'
                ).setScale(0.7);

                // 随机旋转脚印
                foot.angle = Phaser.Math.Between(-30, 30);

                // 随机左右脚翻转
                if (Phaser.Math.Between(0, 1) === 1) {
                    foot.flipX = true;
                }

                this.footprints.add(foot);

                // 添加按压动画
                this.tweens.add({
                    targets: foot,
                    alpha: 0.7,
                    duration: 100,
                    yoyo: true,
                    repeat: 0
                });

                // 如果完成踩踏，进入下一环节
                if (this.treadProgress >= this.maxTreadProgress) {
                    setTimeout(() => {
                        this.scene.start('PulpFishingScene', {
                            bamboo: this.bambooType,
                            soakQuality: this.soakQuality,
                            treadQuality: 'good'
                        });
                    }, 500);
                }
            }
        }
    }

    class PulpFishingScene extends Phaser.Scene {
        constructor() {
            super('PulpFishingScene');
        }

        init(data) {
            this.bambooType = data.bamboo;
            this.soakQuality = data.soakQuality;
            this.treadQuality = data.treadQuality;
        }

        preload() {
            this.load.image('vat', 'assets/pulp_vat.png'); // 纸浆桶
            this.load.image('screen', 'assets/bamboo_screen.png'); // 竹筛
        }

        create() {
            // 背景
            this.add.rectangle(400, 300, 800, 600, GlobalStyles.colors.light);

            // 标题
            this.add.text(400, 80, '捞浆', {
                fontSize: '42px',
                fill: GlobalStyles.colors.text,
                fontFamily: GlobalStyles.fonts.title,
                stroke: '#fff',
                strokeThickness: 2
            }).setOrigin(0.5);

            // 纸浆桶
            this.add.image(400, 400, 'vat').setScale(1.1);

            // 竹筛 - 可拖动
            this.screen = this.add.image(400, 350, 'screen').setScale(0.8).setInteractive();
            this.input.setDraggable(this.screen);

            // 拖动事件
            this.input.on('drag', (pointer, gameObject, dragX, dragY) => {
                // 限制在桶内移动
                gameObject.x = Phaser.Math.Clamp(dragX, 200, 600);
                gameObject.y = Phaser.Math.Clamp(dragY, 250, 450);

                // 增加纸浆点
                this.addPulpParticle(gameObject.x, gameObject.y);
            });

            // 进度
            this.pulpCoverage = 0;
            this.maxCoverage = 20;
            this.progressText = this.add.text(400, 200, `纸浆分布: 0/${this.maxCoverage}`, {
                fontSize: '24px',
                fill: GlobalStyles.colors.text,
                fontFamily: GlobalStyles.fonts.body
            }).setOrigin(0.5);

            // 提示文本
            this.add.text(400, 250, '拖动竹筛使纸浆均匀分布', {
                fontSize: '22px',
                fill: GlobalStyles.colors.text,
                fontFamily: GlobalStyles.fonts.body,
                align: 'center'
            }).setOrigin(0.5);

            // 纸浆粒子容器
            this.pulpParticles = this.add.container();
        }

        addPulpParticle(x, y) {
            if (this.pulpCoverage < this.maxCoverage) {
                this.pulpCoverage++;
                this.progressText.setText(`纸浆分布: ${this.pulpCoverage}/${this.maxCoverage}`);

                // 创建纸浆粒子
                const particle = this.add.circle(x, y, Phaser.Math.Between(3, 6), 0xd2b48c, 0.8);
                this.pulpParticles.add(particle);

                // 完成时进入下一环节
                if (this.pulpCoverage >= this.maxCoverage) {
                    setTimeout(() => {
                        this.scene.start('BakingScene');
                    }, 500);
                }
            }
        }
    }

    class BakingScene extends Phaser.Scene {
        constructor() {
            super('BakingScene');
        }

        preload() {
            this.load.image('oven', 'assets/baking_oven.png'); // 烘烤箱
            this.load.image('paper_sheet', 'assets/paper_sheet.png'); // 纸张
        }

        create() {
            // 背景
            this.add.rectangle(400, 300, 800, 600, GlobalStyles.colors.light);

            // 标题
            this.add.text(400, 80, '烘干纸张', {
                fontSize: '42px',
                fill: GlobalStyles.colors.text,
                fontFamily: GlobalStyles.fonts.title,
                stroke: '#fff',
                strokeThickness: 2
            }).setOrigin(0.5);

            // 烘烤箱
            this.add.image(400, 400, 'oven').setScale(1.1);

            // 纸张
            this.paper = this.add.image(400, 320, 'paper_sheet').setScale(0.7).setAlpha(0.7);

            // 温度调节滑块背景
            this.add.rectangle(400, 200, 300, 30, 0xcccccc).setOrigin(0.5);

            // 温度滑块
            this.tempSlider = this.add.rectangle(300, 200, 30, 30, GlobalStyles.colors.highlight).setOrigin(0.5).setInteractive();
            this.input.setDraggable(this.tempSlider);

            // 温度文本
            this.tempText = this.add.text(400, 240, '温度: 50°C', {
                fontSize: '24px',
                fill: GlobalStyles.colors.text,
                fontFamily: GlobalStyles.fonts.body
            }).setOrigin(0.5);

            // 烘干进度
            this.bakeProgress = 0;
            this.maxBakeProgress = 100;
            this.idealTemp = 70; // 理想温度
            this.currentTemp = 50;

            // 进度条
            this.bakeBar = this.add.graphics();

            // 拖动滑块调节温度
            this.input.on('drag', (pointer, gameObject, dragX) => {
                // 限制在滑块轨道内
                gameObject.x = Phaser.Math.Clamp(dragX, 300, 500);

                // 计算温度 (50-150°C)
                this.currentTemp = 50 + Math.round((gameObject.x - 300) / 2);
                this.tempText.setText(`温度: ${this.currentTemp}°C`);

                // 根据温度接近理想值的程度增加进度
                const tempFactor = 1 - Math.abs(this.currentTemp - this.idealTemp) / 100;
                this.bakeProgress += tempFactor * 0.5;

                if (this.bakeProgress > this.maxBakeProgress) {
                    this.bakeProgress = this.maxBakeProgress;
                    this.scene.start('FinalScene');
                }

                this.updateBakeBar();
            });

            // 提示文本
            this.add.text(400, 280, '拖动滑块调整温度，使纸张均匀干燥', {
                fontSize: '22px',
                fill: GlobalStyles.colors.text,
                fontFamily: GlobalStyles.fonts.body,
                align: 'center'
            }).setOrigin(0.5);

            // 初始化进度条
            this.updateBakeBar();
        }

        updateBakeBar() {
            this.bakeBar.clear();
            this.bakeBar.fillStyle(GlobalStyles.colors.secondary, 0.7);
            this.bakeBar.fillRoundedRect(250, 150, 300 * (this.bakeProgress / this.maxBakeProgress), 20, 5);
        }
    }

    class FinalScene extends Phaser.Scene {
        constructor() {
            super('FinalScene');
        }

        preload() {
            this.load.image('finished_paper', 'assets/finished_paper.png'); // 成品纸
            this.load.image('seal', 'assets/seal.png'); // 印章
        }

        create() {
            // 背景
            this.add.rectangle(400, 300, 800, 600, 0xf8f4e6);

            // 标题
            const title = this.add.text(400, 80, '纸张完成！', {
                fontSize: '48px',
                fill: GlobalStyles.colors.primary,
                fontFamily: GlobalStyles.fonts.title,
                stroke: '#fff',
                strokeThickness: 2
            }).setOrigin(0.5);

            // 添加标题动画
            this.tweens.add({
                targets: title,
                scale: 1.1,
                duration: 1000,
                yoyo: true,
                repeat: -1
            });

            // 成品纸
            const paper = this.add.image(400, 320, 'finished_paper').setScale(0.9);

            // 添加纸张动画
            this.tweens.add({
                targets: paper,
                y: 310,
                duration: 3000,
                yoyo: true,
                repeat: -1,
                ease: 'Sine.inOut'
            });

            // 印章
            const seal = this.add.image(550, 250, 'seal').setScale(0.4).setAlpha(0);
            setTimeout(() => {
                this.tweens.add({
                    targets: seal,
                    alpha: 1,
                    duration: 1000
                });
            }, 1000);

            // 描述文本
            this.add.text(400, 450, '这是您制作的畲乡玉扣纸，\n以其细腻的质地和独特的制作工艺闻名于世', {
                fontSize: '22px',
                fill: GlobalStyles.colors.text,
                fontFamily: GlobalStyles.fonts.body,
                align: 'center',
                lineSpacing: 10
            }).setOrigin(0.5);

            // 重新开始按钮
            const restartBtn = this.add.text(400, 530, '重新制作', {
                fontSize: '24px',
                fill: '#fff',
                fontFamily: GlobalStyles.fonts.body,
                backgroundColor: GlobalStyles.colors.primary,
                padding: { left: 20, right: 20, top: 10, bottom: 10 },
                borderRadius: 5
            }).setOrigin(0.5).setInteractive();

            // 按钮交互
            restartBtn.on('pointerover', () => {
                restartBtn.setBackgroundColor(GlobalStyles.colors.highlight);
            });

            restartBtn.on('pointerout', () => {
                restartBtn.setBackgroundColor(GlobalStyles.colors.primary);
            });

            restartBtn.on('pointerdown', () => {
                this.scene.start('BambooSelectionScene');
            });
        }
    }

    const config = {
        type: Phaser.AUTO,
        width: 800,
        height: 600,
        parent: 'game',
        backgroundColor: GlobalStyles.colors.light,
        scene: [BambooSelectionScene, SoakingScene, TreadingScene, PulpFishingScene, BakingScene, FinalScene]
    };

    const game = new Phaser.Game(config);
</script>
</body>
</html>
